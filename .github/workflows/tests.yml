# Tests automatiques : à chaque push et à chaque pull request, GitHub utilise l'appli
# dans un navigateur et vérifie la sécurité du code et de la base. Résultat : ✅ ou ❌.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Le minimum de droits : ce workflow lit le code, il n'écrit rien
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Utiliser l'appli et vérifier la sécurité du code
        run: npx playwright test
      - name: Rapport (captures d'écran des échecs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: playwright-report/
          retention-days: 7

  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Préparer une base vide comme sur Supabase
        run: psql -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; grant usage on schema public to anon, authenticated;"
      - name: Installer la base et les exemples
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql -f supabase/exemple.sql
      - name: Vérifier la sécurité de la base
        run: psql -v ON_ERROR_STOP=1 -f tests/base.sql
